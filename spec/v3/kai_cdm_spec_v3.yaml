        1=Yes, 2=No, 3=Unknown, 4=Not Applicable (남성인 경우)'
      codelist: BREAST_CANCER.postpartum_at_diagnosis
    - name: fertility_history
      type: integer
      required: true
      desc: '가임력 보존 치료 여부를 나타내는 코드값이다.

        1=Yes, 2=No, 3=Unknown, 4=Not Applicable (남성인 경우)'
      codelist: BREAST_CANCER.fertility_history
    - name: fertility_treatment_type
