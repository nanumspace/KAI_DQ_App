      desc: 약제의 단일 용량 값이다.
      range: *id002
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: amount_unit_concept_id
      type: integer
      required: false
      desc: 단일 용량 단위를 나타내는 표준코드이다.
      codelist: OMOP.amount_unit_concept_id
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: quantity
      type: float
      required: false
      desc: 1일당 투여 횟수이다.
      range: *id026
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: days_supply
      type: integer
      required: false
      desc: 약물 처방일수이다.
      range: *id027
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: sig
      type: varchar
      required: false
      desc: 약물 복용 지시사항이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: route_concept_id
      type: integer
      required: false
      desc: 약물 투여 경로를 나타내는 표준코드이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: lot_number
      type: varchar
      required: false
      desc: 약품 식별번호이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: drug_source_value
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 약품 코드이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: drug_source_concept_id
      type: integer
      required: false
      desc: 의료기관에서 실제로 사용하는 약품 코드에 대한 표준코드이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: route_source_value
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 약물 투여 경로에 대한 코드이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: dose_unit_source_value
      type: varchar
      required: false
      desc: 약물 용량 단위 정보이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: medical_dept
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 진료과 코드이다.
      group: org
      level: event
    - name: ward_cd
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 병동 코드이다.
      group: org
      level: event
    - name: death_date
      type: date
      required: false
      desc: 사망한 날짜이다.
      group: death
      level: event
    - name: death_datetime
      type: timestamp
      required: false
      desc: 사망한 일시이다.
      group: death
      anchor: death_date
      level: event
    - name: death_type_concept_id
      type: integer
      required: false
      desc: 사망정보 기록의 출처를 나타내는 표준코드이다.
      group: death
      anchor: death_date
      level: event
    - name: cause_concept_id
      type: integer
      required: false
      desc: 사망원인을 나타내는 표준코드이다.
      group: death
      anchor: death_date
      level: event
    - name: cause_source_value
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 사망원인 코드이다.
      group: death
      anchor: death_date
      level: event
    - name: cause_source_concept_id
      type: integer
      required: false
      desc: 의료기관에서 실제로 사용하는 사망원인 코드의 표준코드이다.
      group: death
      anchor: death_date
      level: event
    - name: hsp_tp_cd
      type: varchar
      required: false
      desc: 의료기관에서 실제로 사용하는 하위기관 분류 코드이다.
      group: org
      level: event
    - name: drug_note_mapping
      type: varchar
      required: false
      desc: 약물 정보 매핑 내용이다.
      group: drug
      anchor: drug_exposure_start_date
      level: event
    - name: note_date
      type: date
      required: false
      desc: 메모 기록 날짜이다.
      group: note
      level: event
    - name: note_type_concept_id
      type: integer
      required: false
      desc: 메모 유형 Concept ID이다.
      codelist: OMOP.note_type_concept_id
      group: note
      anchor: note_date
      level: event
    - name: note_text
      type: varchar
      required: false
      desc: 메모 원문(판독문 등) 내용이다.
      group: note
      anchor: note_date
      level: event
    grain: 1행 = 1 이벤트 그룹 인스턴스 (person_id, visit_occurrence_id, group). group='patient' 필드는 동일 person_id 의 모든 행에서 값이 동일해야 한다.
    groups:
      person:
        anchor: null
      care_site:
        anchor: null
      visit:
        anchor: visit_start_date
      condition:
        anchor: condition_start_date
      measurement:
        anchor: measurement_date
      drug:
        anchor: drug_exposure_start_date
      death:
        anchor: death_date
      note:
        anchor: note_date
      org:
        anchor: null
      patient:
        anchor: null
  LYMPHOMA:
    name: LYMPHOMA
    kor: 림프종
    section: 4.6 림프종(LYMPHOMA)
    category: disease
    pk: lym_id
    fields:
    - name: lym_id
      type: integer
      required: true
      desc: 림프종 특화 테이블에 대한 고유 식별자이다.
      key: PK
      group: key
      level: key
    - name: person_id
      type: integer
      required: true
      desc: PERSON 테이블에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
      group: key
      level: key
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: 해당 평가 또는 치료가 이루어진 방문의 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
      group: key
      level: key
    - name: condition_occurrence_id
      type: integer
      required: false
      desc: 림프종 진단 사건의 외래키이다.
      key: FK
      ref: CONDITION_OCCURRENCE.condition_occurrence_id
      group: key
      level: key
    - name: observation_id
      type: integer
      required: false
      desc: 병기, 증상, 위험도 등 관찰정보의 외래키이다.
      key: FK
      ref: OBSERVATION.observation_id
      group: key
      level: key
    - name: measurement_id
      type: integer
      required: false
      desc: 검사, 영상 정량값 및 병리 측정정보의 외래키이다.
      key: FK
      ref: MEASUREMENT.measurement_id
      group: key
      level: key
    - name: procedure_occurrence_id
      type: integer
      required: false
      desc: 생검, 영상검사, 방사선치료, 세포채집 또는 이식 시술의 외래키이다.
      key: FK
      ref: PROCEDURE_OCCURRENCE.procedure_occurrence_id
      group: key
      level: key
    - name: drug_exposure_id
      type: integer
      required: false
      desc: 개별 약물 노출의 외래키이다.
      key: FK
      ref: DRUG_EXPOSURE.drug_exposure_id
      group: key
      level: key
    - name: antp_id
      type: integer
      required: false
      desc: 항암요법 에피소드의 외래키이다.
      key: FK
      ref: ANTP_THERAPY.antp_id
      group: patient
      level: person
    - name: adverse_event_id
      type: integer
      required: false
      desc: 치료 관련 이상사례의 외래키이다.
      key: FK
      ref: ADVERSE_EVENT.adverse_event_id
      group: key
      level: key
    - name: note_id
      type: integer
      required: false
      desc: 병리·영상·진료기록 원문의 외래키이다.
      key: FK
      ref: NOTE.note_id
      group: key
      level: key
    - name: file_id
      type: integer
      required: false
      desc: PET/CT, CT, MRI 또는 병리 이미지 파일의 외래키이다.
      key: FK_EXTERNAL
      ref: FILE
      group: patient
      level: person
    - name: diagnosis_date
      type: date
      required: false
      desc: 림프종을 최초로 확진한 날짜이다.
      group: dx
      level: event
    - name: diagnosis_status
      type: varchar
      required: false
      desc: '진단 상태이다. 예: newly diagnosed, relapsed, refractory, transformed.'
      suggested_values:
      - newly diagnosed
      - relapsed
      - refractory
      - transformed
      group: dx
      anchor: diagnosis_date
      level: event
    - name: lymphoma_group
      type: varchar
      required: false
      desc: '림프종 대분류이다. 예: Hodgkin lymphoma, non-Hodgkin lymphoma.'
      suggested_values:
      - Hodgkin lymphoma
      - non-Hodgkin lymphoma
      group: dx
      anchor: diagnosis_date
      level: event
    - name: cell_lineage
      type: varchar
      required: false
      desc: '종양 세포 계열이다. 예: B-cell, T-cell, NK-cell, indeterminate.'
      suggested_values:
      - B-cell
      - T-cell
      - NK-cell
      - indeterminate
      group: dx
      anchor: diagnosis_date
      level: event
    - name: histologic_subtype
      type: varchar
      required: false
      desc: 'WHO/ICC 기준의 조직학적 아형이다. 예: DLBCL, follicular lymphoma, mantle cell lymphoma, classical Hodgkin lymphoma.'
      suggested_values:
      - DLBCL
      - follicular lymphoma
      - mantle cell lymphoma
      - classical Hodgkin lymphoma
      group: dx
      anchor: diagnosis_date
      level: event
    - name: histologic_subtype_source_value
      type: varchar
      required: false
      desc: 조직학적 아형의 원천 진단명 또는 원천 코드이다.
      group: dx
      anchor: diagnosis_date
      level: event
    - name: classification_version
      type: varchar
      required: false
      desc: 진단에 사용한 WHO 또는 ICC 분류체계와 버전이다.
      group: dx
      anchor: diagnosis_date
      level: event
    - name: primary_disease_site
      type: varchar
      required: false
      desc: 림프종의 주된 침범 부위이다. 결절성, 결절외 또는 원발 장기를 기록한다.
      group: dx
      anchor: diagnosis_date
      level: event
    - name: biopsy_date
      type: date
      required: false
      desc: 확진 또는 재평가를 위한 조직 생검 시행일이다.
      group: biopsy
      level: event
    - name: biopsy_method
      type: varchar
      required: false
      desc: '생검 방법이다. 예: excisional, incisional, core needle, bone marrow biopsy.'
      suggested_values:
      - excisional
      - incisional
      - core needle
      - bone marrow biopsy
      group: biopsy
      anchor: biopsy_date
      level: event
    - name: biopsy_site
      type: varchar
      required: false
      desc: 생검 조직을 채취한 해부학적 부위이다.
      group: biopsy
      anchor: biopsy_date
      level: event
    - name: biopsy_specimen_adequacy
      type: varchar
      required: false
      desc: 병리·면역표현형·분자검사를 위한 검체 적절성 결과이다.
      group: biopsy
      anchor: biopsy_date
      level: event
    - name: transformation_yn
      type: integer
      required: false
      desc: 저등급 림프종의 고등급 림프종 전환 여부이다. 1=Yes, 0=No.
      codelist: LYMPHOMA.transformation_yn
      group: transf
      anchor: transformation_date
      level: event
    - name: transformation_from_subtype
      type: varchar
      required: false
      desc: 전환 이전의 림프종 아형이다.
      group: transf
      anchor: transformation_date
      level: event
    - name: transformation_to_subtype
      type: varchar
      required: false
      desc: 전환 후 확진된 림프종 아형이다.
      group: transf
      anchor: transformation_date
      level: event
    - name: transformation_date
      type: date
      required: false
      desc: 조직학적 전환을 확진한 날짜이다.
      group: transf
      level: event
    - name: stage_assessment_date
      type: date
      required: false
      desc: 림프종 병기를 평가한 날짜이다.
      group: stage
      level: event
    - name: stage_system
      type: varchar
      required: false
      desc: '병기 분류체계이다. 예: Ann Arbor, Lugano.'
      suggested_values:
      - Ann Arbor
      - Lugano
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: ann_arbor_lugano_stage
      type: varchar
      required: false
      desc: Ann Arbor/Lugano 병기값이다. I, II, III, IV로 기록한다.
      pattern: ^(I|II|III|IV)$
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: stage_suffix
      type: varchar
      required: false
      desc: 병기 수식자이다. A, B, E, S 또는 복합값을 기록한다.
      pattern: ^[ABES]{1,3}$
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: staging_method
      type: varchar
      required: false
      desc: '병기 결정에 사용한 방법이다. 예: PET/CT, CT, MRI, bone marrow assessment.'
      suggested_values:
      - PET/CT
      - CT
      - MRI
      - bone marrow assessment
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: nodal_regions_involved_count
      type: integer
      required: false
      desc: 침범된 림프절 영역의 개수이다.
      range:
      - 0
      - 20
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: extranodal_involvement_yn
      type: integer
      required: false
      desc: 결절외 침범 여부이다. 1=Yes, 0=No.
      codelist: LYMPHOMA.extranodal_involvement_yn
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: extranodal_site_count
      type: integer
      required: false
      desc: 침범된 결절외 장기 또는 부위의 개수이다.
      range:
      - 0
      - 20
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: extranodal_sites
      type: varchar
      required: false
      desc: 결절외 침범 부위를 구분자로 연결한 원천값이다. 반복 관찰로 적재하는 것을 우선한다.
      multivalued: true
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: spleen_involvement_yn
      type: integer
      required: false
      desc: 비장 침범 여부이다. 1=Yes, 0=No.
      codelist: LYMPHOMA.spleen_involvement_yn
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: bone_marrow_involvement_yn
      type: integer
      required: false
      desc: 골수 침범 여부이다. 1=Yes, 0=No.
      codelist: LYMPHOMA.bone_marrow_involvement_yn
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: bone_marrow_involvement_pct
      type: float
      required: false
      desc: 골수 내 림프종 침범 비율(%)이다.
      range:
      - 0
      - 100
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: cns_involvement_yn
      type: integer
      required: false
      desc: 중추신경계 침범 여부이다. 1=Yes, 0=No.
      codelist: LYMPHOMA.cns_involvement_yn
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: bulky_disease_yn
      type: integer
      required: false
      desc: 프로토콜 또는 진료지침 기준의 bulky disease 여부이다.
      codelist: COMMON.yn01
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: bulky_disease_threshold_cm
      type: float
      required: false
      desc: bulky disease 판정에 적용한 최대 직경 기준(cm)이다.
      range:
      - 5
      - 15
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: largest_lesion_diameter_cm
      type: float
      required: false
      desc: 기준 시점의 가장 큰 병변 장경(cm)이다.
      range:
      - 0
      - 40
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: b_symptom_yn
      type: integer
      required: false
      desc: 림프종 B symptom 존재 여부이다.
      codelist: COMMON.yn01
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: unexplained_fever_yn
      type: integer
      required: false
      desc: 감염 등 다른 원인으로 설명되지 않는 발열 여부이다.
      codelist: COMMON.yn01
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: drenching_night_sweats_yn
      type: integer
      required: false
      desc: 흠뻑 젖는 야간 발한 여부이다.
      codelist: COMMON.yn01
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: weight_loss_6mo_pct
      type: float
      required: false
      desc: 최근 6개월 동안 비의도적 체중감소율(%)이다.
      range:
      - 0
      - 100
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: ecog_performance_status
      type: integer
      required: false
      desc: 평가 시점의 ECOG 수행능력 점수(0-5)이다.
      range: &id028
      - 0
      - 5
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: measurable_disease_yn
      type: integer
      required: false
      desc: Lugano 등 적용 기준에 따른 측정가능 병변 존재 여부이다.
      codelist: COMMON.yn01
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: target_lesion_count
      type: integer
      required: false
      desc: 반응평가에 선택한 표적 병변의 개수이다.
      range:
      - 0
      - 10
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: sum_product_diameters
      type: float
      required: false
      desc: 표적 병변 수직 직경곱의 합(SPD)이다.
      range:
      - 0
      - 100000
      group: stage
      anchor: stage_assessment_date
      level: event
    - name: pet_ct_assessment_date
      type: date
      required: false
      desc: FDG PET/CT 반응평가 시행일이다.
      group: pet
      level: event
    - name: pet_suvmax
      type: float
      required: false
      desc: 대표 또는 최고 대사활성 병변의 SUVmax이다.
      range:
      - 0
      - 100
      group: pet
      anchor: pet_ct_assessment_date
      level: event
    - name: metabolic_tumor_volume
      type: float
      required: false
      desc: PET 기반 metabolic tumor volume(MTV)이다.
      range:
      - 0
      - 10000
      group: pet
      anchor: pet_ct_assessment_date
      level: event
    - name: total_lesion_glycolysis
      type: float
      required: false
      desc: PET 기반 total lesion glycolysis(TLG)이다.
      range:
      - 0
      - 100000
      group: pet
      anchor: pet_ct_assessment_date
      level: event
    - name: ihc_test_date
      type: date
      required: false
      desc: 면역조직화학검사 시행일이다.
      group: ihc
      level: event
    - name: cd3_result
      type: varchar
      required: false
      desc: CD3 면역조직화학 또는 유세포검사 결과이다.
      group: ihc
      anchor: ihc_test_date
      level: event
    - name: cd5_result
      type: varchar
      required: false
      desc: CD5 검사 결과이다.
      group: ihc
      anchor: ihc_test_date
      level: event
    - name: cd10_result
      type: varchar
      required: false
      desc: CD10 검사 결과이다.
      group: ihc
      anchor: ihc_test_date
      level: event
    - name: cd15_result
      type: varchar
      required: false
      desc: CD15 검사 결과이다.
      group: ihc
      anchor: ihc_test_date
      level: event
    - name: cd19_result
