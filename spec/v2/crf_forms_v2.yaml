    - name: distant_metastasis_site
      kor: 원격 전이 부위
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_DISTANT_METASTASIS_SITE
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000395
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000395
        value_column: value_as_concept_id
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
