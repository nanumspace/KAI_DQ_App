    - DIABETES
    - LYMPHOMA
    fields:
    - name: person_id
      type: bigint
      required: true
      desc: 환자 고유키(가명). 코호트 안에서 유일하며 모든 표가 이 값으로 환자를 가리킨다
      kor: 환자 ID
      note: 환자 고유키(가명)
    - name: gender_concept_id
      type: bigint
      required: true
      desc: 성별. OMOP Gender concept(남 8507 · 여 8532)
      kor: 성별 concept
      note: 성별 concept
      vocab_hint: OMOP Gender
    - name: year_of_birth
      type: integer
      required: true
      desc: 출생 연도(YYYY). 나이 계산의 기준
      kor: 출생 연도
      note: 출생 연도
