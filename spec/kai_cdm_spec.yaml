      group: mtst
      anchor: mtdg_ymd
      level: event
    - name: mtst_site_nm
      type: varchar
      required: false
      desc: 전이암 부위 명칭(원격 전이 정보)이다.
      group: mtst
      anchor: mtdg_ymd
      level: event
    - name: diag_stag_rcrd_ymd
      type: date
      required: false
      desc: 진단 병기 정보 기록 연월일이다.
      group: stag
      level: event
    - name: clnc_tumr_prty_cd
      type: varchar
      required: false
      desc: 임상 종양특성을 나타내는 코드값이다.
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: clnc_tumr_prty_nm
      type: varchar
      required: false
      desc: 임상 종양특성 명칭이다.
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: clnc_tnm_stag_vl
      type: varchar
      required: false
      desc: 수술 전 검사 결과에 따른 임상 TNM 병기값이다.
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: clnc_t_stag_vl
      type: varchar
      required: false
      desc: 수술 전 검사 결과에 따른 임상 T 병기값이다.
      pattern: ^(c?)(T(is|0|X|1[abc]?(mi)?|2[ab]?|3|4[abcd]?))$
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: clnc_n_stag_vl
      type: varchar
      required: false
      desc: 수술 전 검사 결과에 따른 임상 N 병기값이다.
      pattern: ^(c?)(N(X|0|1[abc]?|2[abc]?|3[abc]?))$
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: clnc_m_stag_vl
      type: varchar
      required: false
      desc: 수술 전 검사 결과에 따른 임상 M 병기값이다.
      pattern: ^(c?)(M(X|0|1[abc]?))$
      group: stag
      anchor: diag_stag_rcrd_ymd
      level: event
    - name: cexm_ymd
      type: date
      required: false
      desc: 진단검사를 시행한 연월일이다.
      group: cexm
      level: event
    - name: cexm_kncd
      type: varchar
      required: false
      desc: 진단검사를 나타내는 코드값으로 병원에서 사용하는 진단검사 LOCAL 코드, EDI 코드값이다.
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: cexm_knnm
      type: varchar
      required: false
      desc: 진단검사 명칭이다.
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: cexm_loinc_cd
      type: varchar
      required: false
      desc: 원내 진단검사 코드에 매핑되는 LOINC 코드값이다.
      pattern: ^[0-9]{1,6}-[0-9]$
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: cexm_loinc_nm
      type: varchar
      required: false
      desc: 원내 진단검사 코드에 매핑되는 LOINC 명칭이다.
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: cexm_rslt_cont
      type: varchar
      required: false
      desc: 진단검사 결과 내용이다.
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: cexm_rslt_unit_cont
      type: varchar
      required: false
      desc: 진단검사 결과값의 단위이다.
      group: cexm
      anchor: cexm_ymd
      level: event
    - name: imex_ymd
      type: date
      required: false
      desc: 영상검사를 시행한 연월일이다.
      group: imex
      level: event
    - name: imex_kncd
      type: varchar
      required: false
      desc: 영상검사를 나타내는 코드값으로 병원에서 사용하는 진단검사 LOCAL 코드, EDI 코드값이다.
      group: imex
      anchor: imex_ymd
      level: event
    - name: imex_knnm
      type: varchar
      required: false
      desc: 영상검사 명칭이다.
      group: imex
      anchor: imex_ymd
      level: event
    - name: imex_smct_cd
      type: varchar
      required: false
      desc: 영상검사에 매핑된 SNOMED CT 코드값으로 후조합 시, "_" 를 구분자로 합쳐서 데이터를 적재한다.
      multivalued: true
      group: imex
      anchor: imex_ymd
      level: event
    - name: imex_smct_nm
      type: varchar
      required: false
      desc: 영상검사에 매핑된 SNOMED CT 명칭으로 후조합 시, "_" 를 구분자로 합쳐서 데이터를 적재한다.
      multivalued: true
      group: imex
      anchor: imex_ymd
      level: event
    - name: bpsy_ymd
      type: date
      required: false
      desc: 생체검사를 시행한 연월일이다.
      group: bpsy
      level: event
    - name: rcrd_ymd
      type: date
      required: false
      desc: 건강정보 기록 연월일로 입원기록지 또는 간호초기평가에서 추출하는 경우 입원일을 기준으로 한다.
      group: hist
      level: event
    - name: death_date
      type: date
      required: false
      desc: 사망한 날짜이다.
      group: patient
      level: person
    - name: note_date
      type: date
      required: false
      desc: 메모 기록 날짜이다.
      group: note
      level: event
    - name: note_type_concept_id
      type: integer
      required: false
      desc: 메모의 유형(영상, 병리 등) Concept ID이다.
      codelist: OMOP.note_type_concept_id
      group: note
      anchor: note_date
      level: event
    - name: note_text
      type: varchar
      required: false
      desc: 메모의 원문(판독문 등) 내용이다.
      group: note
      anchor: note_date
      level: event
    grain: 1행 = 1 이벤트 그룹 인스턴스 (person_id, visit_occurrence_id, group). group='patient' 필드는 동일 person_id 의 모든 행에서 값이 동일해야 한다.
    groups:
