      patient:
        anchor: null
  MASLD:
    name: MASLD
    kor: 대사이상지방간
    section: 4.4 대사이상지방간(MASLD)
    category: disease
    pk: masld_id
    fields:
    - name: masld_id
      type: integer
      required: true
      desc: 대사이상지방간 특화 테이블에 대한 고유 식별자이다.
      key: PK
      group: key
      level: key
    - name: person_id
      type: integer
      required: true
      desc: PERSON 테이블에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
      group: key
      level: key
    - name: observation_id
      type: integer
      required: false
      desc: OBSERVATION 테이블에 대한 외래키이다.
      key: FK
      ref: OBSERVATION.observation_id
      group: key
      level: key
    - name: condition_occurrence_id
      type: integer
      required: false
      desc: CONDITION_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: CONDITION_OCCURRENCE.condition_occurrence_id
      group: key
      level: key
    - name: measurement_id
      type: integer
      required: false
      desc: MEASUREMENT 테이블에 대한 외래키이다.
      key: FK
      ref: MEASUREMENT.measurement_id
      group: key
      level: key
    - name: procedure_occurrence_id
      type: integer
      required: false
      desc: PROCEDURE_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: PROCEDURE_OCCURRENCE.procedure_occurrence_id
      group: key
      level: key
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: VISIT_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
      group: key
      level: key
    - name: drug_exposure_id
      type: integer
      required: false
      desc: DRUG_EXPOSURE 테이블에 대한 외래키이다.
      key: FK
      ref: DRUG_EXPOSURE.drug_exposure_id
      group: key
      level: key
    - name: antp_id
      type: integer
      required: false
      desc: ANTP_THERAPY 테이블에 대한 외래키이다.
      key: FK
      ref: ANTP_THERAPY.antp_id
      group: patient
      level: person
    - name: note_id
      type: integer
      required: false
      desc: NOTE 테이블에 대한 외래키이다.
      key: FK
      ref: NOTE.note_id
      group: key
      level: key
    - name: adverse_event_id
      type: integer
      required: false
      desc: ADVERSE_EVENT 테이블에 대한 외래키이다.
      key: FK
      ref: ADVERSE_EVENT.adverse_event_id
      group: key
      level: key
    - name: file_id
      type: integer
      required: false
      desc: 이미지/영상 파일 ID
      key: FK_EXTERNAL
      ref: FILE
      group: patient
      level: person
    - name: fib4_score
      type: float
      required: false
      desc: "FIB-4 산출 결과값 \nFormula = age (years) × AST [U/L] / (platelet count[109/L]) × \n(ALT [U/L]1/2)"
      range:
      - 0
      - 50
      group: score
      anchor: exam_gnrx_ymd
      level: event
    - name: apri_score
      type: float
      required: false
      desc: 'APRI 산출 결과값

        Formula = [(AST/upper limit of normal of AST)×100] / platelet count(109/L)×100'
      range:
      - 0
      - 30
      group: score
      anchor: exam_gnrx_ymd
      level: event
    - name: bard_score
      type: float
      required: false
      desc: 'BARD 산출 결과값

        이하 항목별 점수 부여 후 합산 (0~4, 총점 기반 위험 분류)

        1. AST/ALT ratio >= 0.8 : 2점

        2. BMI >= 28kg/m² : 1점

        3. 당뇨병: 1점'
      range:
      - 0
      - 4
      group: score
      anchor: exam_gnrx_ymd
      level: event
    - name: safe_score
      type: float
      required: false
      desc: "SAFE 스코어 산출 결과값\nFormula = (2.97 × age) + (5.99 × BMI [BMI > 40은 40으로 설정]) \n+ (62.85 × diabetes [없으면 0, 있으면 1] + (154.85 × Ln(AST))\
        \ \n- (58.23 × Ln(ALT)) + (195.48 × Ln(globulin))\n- (141.61 × Ln(platelets) - 75)"
      range:
      - -50
      - 300
      group: score
      anchor: exam_gnrx_ymd
      level: event
    - name: lrs_score
      type: float
      required: false
      desc: 'LiverRisk score 산출 결과값

        Calculator https://www.liverriskscore.com/multicalc'
      range:
      - 0
      - 30
      group: score
      anchor: exam_gnrx_ymd
      level: event
    - name: imex_rslt_cont
      type: varchar
      required: false
      desc: 영상검사 결과 내용이다.
      group: imex
      anchor: imex_ymd
      level: event
    - name: lver_fbrs_grnm
      type: varchar
      required: false
      desc: 주위 간실질의 간섬유화 등급명칭이다.
      group: imex
      anchor: imex_ymd
      level: event
    - name: drnk_dtrn_ycnt
      type: integer
      required: false
      desc: 총 음주기간(년)이다.
      range:
      - 0
      - 90
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: drnk_nt
      type: float
      required: false
      desc: 월평균 음주횟수(회/월)이다.
      range:
      - 0
      - 31
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: drnk_qty
      type: float
      required: false
      desc: 평균 음주량(병/회)이다.
      range:
      - 0
      - 20
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: shis_yn_noans_spcd
      type: varchar
      required: false
      desc: 흡연력 여부를 나타내는 코드값이다.
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: shis_yn_noans_spnm
      type: varchar
      required: false
      desc: 흡연력 여부 명칭이다.
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: smok_dtrn_ycnt
      type: integer
      required: false
      desc: 총 흡연기간(년 수)이다.
      range: *id019
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: smok_qty
      type: float
      required: false
      desc: 1일 평균 흡연량(갑/일)이다.
      range: *id020
