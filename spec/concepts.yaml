# 규칙 카탈로그(단계 1)와 가상데이터 생성기(단계 2)가 공유하는 대표 concept 목록.
# concept_id 는 OMOP 표준 어휘의 대표값이며, 병원 적용 전 Athena 로 최신 어휘와 대조해야 한다.
# (검증 프로그램은 이 목록을 '허용 집합' 이 아니라 '코호트 정의 및 타당성 범위' 용도로만 사용한다.)

cohort_definition:
  LUNG_CANCER:
    condition_concept_ids: [4115276, 4311499, 258375]     # Primary malignant neoplasm of lung / NSCLC / SCLC
    kcd_prefix: ["C34"]
    age_at_index: {median_min: 55, median_max: 75}
    female_ratio: {min: 0.2, max: 0.6}
  BREAST_CANCER:
    condition_concept_ids: [4112853, 4162253]              # Malignant tumor of breast / Carcinoma in situ of breast
    kcd_prefix: ["C50", "D05"]
    age_at_index: {median_min: 40, median_max: 65}
    female_ratio: {min: 0.95, max: 1.0}
  COLORECTAL_CANCER:
    condition_concept_ids: [4180790, 4164337, 443381]      # Colon / Rectum / Rectosigmoid
    kcd_prefix: ["C18", "C19", "C20", "C21"]
    age_at_index: {median_min: 55, median_max: 75}
    female_ratio: {min: 0.3, max: 0.6}
  MASLD:
    condition_concept_ids: [4058680, 46273476]             # Fatty liver / NAFLD
    kcd_prefix: ["K76"]
    age_at_index: {median_min: 40, median_max: 65}
    female_ratio: {min: 0.3, max: 0.7}
  DIABETES:
    condition_concept_ids: [201826]                        # Type 2 diabetes mellitus
    kcd_prefix: ["E11"]
    age_at_index: {median_min: 45, median_max: 70}
    female_ratio: {min: 0.3, max: 0.7}
  LYMPHOMA:
    condition_concept_ids: [4300704, 438090, 4147411, 4038836, 4038838]  # DLBCL / Hodgkin / Follicular / Mantle cell / PTCL
    kcd_prefix: ["C81", "C82", "C83", "C84", "C85"]
    age_at_index: {median_min: 45, median_max: 75}
    female_ratio: {min: 0.3, max: 0.6}

