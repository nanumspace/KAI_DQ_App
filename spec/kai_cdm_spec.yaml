      anchor: exam_gnrx_ymd
      level: event
    - name: age
      type: integer
      required: false
      desc: Fib-4 Index 산출 시 필요한 연령 값으로 지표산출검사_시행일에서 생년월일을 빼서 산출한다.
      range:
