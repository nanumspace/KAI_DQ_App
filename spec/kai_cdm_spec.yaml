    grain: 1행 = 1 이벤트 그룹 인스턴스 (person_id, visit_occurrence_id, group). group='patient' 필드는 동일 person_id 의 모든 행에서 값이 동일해야 한다.
    groups:
      dx:
        anchor: diagnosis_date
      biopsy:
        anchor: biopsy_date
      transf:
        anchor: transformation_date
      stage:
        anchor: stage_assessment_date
      pet:
        anchor: pet_ct_assessment_date
      ihc:
        anchor: ihc_test_date
      mol:
        anchor: molecular_test_date
      prog:
        anchor: prognostic_score_date
      tx:
        anchor: treatment_start_date
      sct:
        anchor: stem_cell_transplant_date
      cart:
        anchor: car_t_infusion_date
      resp:
        anchor: response_assessment_date
      outcome:
        anchor: progression_date
      fu:
        anchor: last_followup_date
      patient:
        anchor: null
  ADVERSE_EVENT:
    name: ADVERSE_EVENT
    kor: 이상사례
    section: 5.1 이상사례(ADVERSE_EVENT)
    category: common_ext
    pk: adverse_event_id
    fields:
    - name: adverse_event_id
      type: integer
      required: true
      desc: 이상사례 특화 테이블에 대한 고유 식별자이다.
      key: PK
    - name: person_id
      type: integer
      required: true
      desc: PERSON 테이블에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
    - name: observation_id
      type: integer
      required: false
      desc: OBSERVATION 테이블에 대한 외래키이다.
      key: FK
      ref: OBSERVATION.observation_id
    - name: condition_occurrence_id
      type: integer
      required: false
      desc: CONDITION_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: CONDITION_OCCURRENCE.condition_occurrence_id
    - name: measurement_id
      type: integer
      required: false
      desc: MEASUREMENT 테이블에 대한 외래키이다.
      key: FK
      ref: MEASUREMENT.measurement_id
    - name: procedure_occurrence_id
      type: integer
      required: false
      desc: PROCEDURE_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: PROCEDURE_OCCURRENCE.procedure_occurrence_id
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: VISIT_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: drug_exposure_id
      type: integer
      required: false
      desc: DRUG_EXPOSURE 테이블에 대한 외래키이다.
      key: FK
      ref: DRUG_EXPOSURE.drug_exposure_id
    - name: antp_id
      type: integer
      required: false
      desc: ANTP_THERAPY 테이블에 대한 외래키이다.
      key: FK
      ref: ANTP_THERAPY.antp_id
    - name: note_id
      type: integer
      required: false
      desc: NOTE 테이블에 대한 외래키이다.
      key: FK
      ref: NOTE.note_id
    - name: adverse_event_concept_id
      type: integer
      required: true
      desc: 이상사례를 나타내는 표준 코드값이다.
    - name: adverse_event_type_concept_id
      type: integer
      required: false
      desc: 이상사례의 기록 유형을 나타내는 코드값이다.
      codelist: OMOP.adverse_event_type_concept_id
    - name: adverse_event_start_date
      type: date
      required: true
      desc: 이상사례가 발생한(또는 인지된) 날짜이다.
    - name: severity_concept_id
      type: integer
      required: false
      desc: 이상사례의 중증도를 나타내는 코드값이다.
      codelist: OMOP.severity_concept_id
    - name: causality_concept_id
      type: integer
      required: false
      desc: 약물과의 인과관계를 나타내는 값이다.
      codelist: OMOP.causality_concept_id
    - name: is_serious
      type: integer
      required: false
      desc: 중대한 이상사례(SAE) 해당 여부를 나타내는 값이다.
      codelist: COMMON.yn01
    - name: seriousness_concept_id
      type: integer
      required: false
      desc: 중대한 이상사례(SAE) 판단 기준에 해당하는 항목을 나타내는 코드값이다.
      codelist: OMOP.seriousness_concept_id
    - name: outcome_concept_id
      type: integer
      required: false
      desc: 이상사례의 결과를 나타내는 코드값이다.
      codelist: OMOP.outcome_concept_id
    - name: action_taken_concept_id
      type: integer
      required: false
      desc: 이상사례에 대해 취해진 조치(약물 관련)를 나타내는 코드값이다.
      codelist: OMOP.action_taken_concept_id
  ANTP_THERAPY:
    name: ANTP_THERAPY
    kor: 항암
    section: 5.3 항암(ANTP_THERAPY)
    category: common_ext
    pk: antp_id
    fields:
    - name: antp_id
      type: integer
      required: true
      desc: 항암요법(에피소드) 고유 식별자. DRUG_EXPOSURE.antp_id가 참조
      key: PK
    - name: person_id
      type: integer
      required: true
      desc: PERSON.person_id 외래키
      key: FK
      ref: PERSON.person_id
    - name: regimen_or_line_of_therapy
      type: integer
      required: true
      desc: 치료 line 번호
      range:
      - 1
      - 15
    - name: regimen
      type: varchar
      required: false
      desc: 항암 레지멘·약제명
    - name: regimen_source_value
      type: varchar
      required: false
      desc: 항암 레지멘·약제명 원천 값. 비일반적 레지멘 표기를 위해 추가
    - name: antp_start_date
      type: date
      required: true
      desc: 항암요법 시작일. drug 연결 시 MIN(drug_exposure_start_date)로 산출 가능
    - name: antp_end_date
      type: date
      required: false
      desc: 항암요법 종료일. drug 연결 시 MAX(drug_exposure_start_date + days_supply - 1)로 산출 가능
    - name: number_of_cycles
      type: integer
      required: false
      desc: 총 투여 사이클 수
      range:
      - 0
      - 60
    - name: treatment_intent_type
      type: integer
      required: false
      desc: 치료 목적 (1=Neoadjuvant, 2=Adjuvant, 3=Palliative, 4=Maintenance, 5=Definitive, 6=Salvage)
      codelist: ANTP_THERAPY.treatment_intent_type
    - name: best_overall_response_source_value
      type: varchar
      required: false
      desc: 치료 반응 평가 원천 값
    - name: drug_category
      type: integer
      required: false
      desc: 약제 기전 (1=세포독성항암제, 2=표적치료제, 3=호르몬치료제, 4=항체-약물 접합체, 5=면역항암제, 6=기타)
      codelist: ANTP_THERAPY.drug_category
    - name: ecog_performance_status
      type: integer
      required: false
      desc: ECOG PS (0–5). 미상=NULL
      range: *id028
    - name: treatment_outcome
      type: integer
      required: false
      desc: '치료 지속 여부 (0: Not on Tx, 1: On Tx). 동일 person_id 기준으로 MAX(sequence_number) 행만 기록함'
    - name: days_to_progression
      type: date
      required: false
      desc: Progressive Disease (질병 진행/악화) 발생일. 동일 person_id 기준으로 MAX(sequence_number) 행만 기록함
    - name: progression_or_recurrence_anatomic_site
      type: varchar
      required: false
      desc: PD 부위·상세 (복수: Liver, LN)
