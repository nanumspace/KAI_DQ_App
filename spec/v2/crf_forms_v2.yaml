      value_kind: 텍스트
      tier: 필수
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000396
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000396
        value_column: value_source_value
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
