    - name: diagnosis_date
      type: date
      required: true
      desc: 림프종을 최초로 확진한 날짜이다.
    - name: histology_icdo3_code
      type: varchar
      required: true
      desc: '림프종의 ICD-O-3 형태 코드이다. 예: DLBCL 9680/3, 외투세포 9673/3, 고전적 호지킨 9650/3, 말초 T세포 NOS 9702/3'
      pattern: ^\d{4}/[0-9]$
    - name: cell_of_origin
      type: varchar
      required: false
      desc: 'DLBCL 세포기원 분류이다. DLBCL 환자(histology_icdo3_code = 9680/3 계열)인 경우에만 입력한다. 예: GCB, ABC/non-GCB, unclassifiable.'
    - name: double_expressor_yn
      type: integer
      required: false
      desc: MYC/BCL2 이중 단백 발현 여부이다.
    - name: double_hit_triple_hit_status
      type: varchar
      required: false
      desc: MYC 및 BCL2/BCL6 재배열 조합에 따른 double-hit 또는 triple-hit 상태이다.
    - name: t_14_18_result
      type: varchar
      required: false
      desc: t(14;18) 전좌 검사 결과이다.
    - name: t_11_14_result
      type: varchar
      required: false
      desc: t(11;14)(q13;q32) 전좌 검사 결과이다.
    - name: mipi_score
      type: integer
      required: false
      desc: Mantle Cell Lymphoma International Prognostic Index(MIPI) 점수이다.
      range:
      - 0
      - 15
    - name: mipi_c_risk_group
      type: varchar
      required: false
      desc: Ki-67을 반영한 MIPI-c 위험군이다.
    - name: hodgkin_ips_score
      type: integer
      required: false
      desc: 진행성 Hodgkin lymphoma의 International Prognostic Score(IPS)이다.
      range:
      - 0
      - 7
    - name: pit_score
      type: integer
      required: false
      desc: 말초 T세포 림프종의 Prognostic Index for T-cell lymphoma(PIT) 점수이다.
      range:
      - 0
      - 4
    - name: minimal_residual_disease_result
      type: varchar
      required: false
      desc: 유세포, PCR 또는 NGS 기반 미세잔존질환(MRD) 결과이다.
    - name: ctdna_result
      type: varchar
      required: false
      desc: 순환종양DNA(ctDNA) 검출 또는 정량 결과이다.
