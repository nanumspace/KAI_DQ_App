    - name: last_followup_date
      kor: 최종 추적관찰일
      type: date
      value_kind: 날짜
      tier: 필수
      standard: SNOMED
      concept_id: 10000000385
      desc: 최종 추적일·질환 상태·생존 상태
      target:
        kind: anchor
        table: COHORT
        column: cohort_end_date
        ref: COHORT
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.disease_status_at_last_followup
    - name: last_vital_status
      kor: 최종 추적 시 생존 상태
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: LAST_STATUS
      standard: SNOMED
      concept_id: 10000000386
      desc: 최종 추적일·질환 상태·생존 상태
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000386
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.vital_status
  STAGING:
    name: STAGING
    kor: 진단·병기 평가
    grain: 환자 × 판정 시점 × 체계
    kind: OMOP 투영
    storage:
    - MEASUREMENT
    cohorts:
    - BREAST_CANCER
    - COLORECTAL_CANCER
    - LUNG_CANCER
    - LYMPHOMA
    fields:
    - name: staging_id
      kor: 진단·병기 평가 ID
      type: bigint
      value_kind: 키
      tier: 필수
      required: true
      key: pk
      desc: 행 고유키
      target:
        kind: skip
        note: 키·기준 필드
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
      - LYMPHOMA
    - name: person_id
      kor: 환자 ID
      type: bigint
      value_kind: 키
      tier: 필수
      required: true
      key: fk
      ref: PERSON.person_id
      target:
        kind: skip
        note: 키·기준 필드
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
      - LYMPHOMA
    - name: visit_occurrence_id
      kor: 방문 ID
      type: bigint
      value_kind: 키
      tier: 권고
      key: fk
      ref: VISIT_OCCURRENCE.visit_occurrence_id
      target:
        kind: skip
        note: 키·기준 필드
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
      - LYMPHOMA
    - name: initial_clinical_stage
      kor: 초진 시 임상 병기
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: STAGE_GROUP_AJCC8
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000387
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000387
        value_column: value_as_concept_id
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - BREAST_CANCER
      - LUNG_CANCER
      v1_hint:
      - LUNG_CANCER.clinical_stage
    - name: stage_iv_diagnosis_date
      kor: 4기 진단일(수술 환자는 재발일)
      type: date
      value_kind: 날짜
      tier: 필수
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000388
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: episode
        table: EPISODE
        concept: EP_RECURRENCE
        start: $stage_iv_diagnosis_date
        parent: '#EP'
        object: '@DX_{cohort}'
      cohorts:
      - LUNG_CANCER
    - name: primary_site
      kor: 폐 종양 원발 부위
      type: varchar
      value_kind: 닫힌 범주
      tier: 보류
      codelist: CL_PRIMARY_SITE
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000389
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000389
        value_column: value_as_concept_id
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LUNG_CANCER
    - name: clinical_tnm
      kor: 수술 전 검사 결과에 따른 임상 TNM 병기값
      type: varchar
      value_kind: 패턴
      tier: 필수
      pattern: ^(y?c)?T(is|0|X|[1-4][a-c]?)N([0-3][a-c]?|X)M(0|1[a-c]?|X)$
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000390
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000390
        value_column: value_source_value
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
      v1_hint:
      - LUNG_CANCER.clnc_tnm_stag_vl
      - BREAST_CANCER.clnc_tnm_stag_vl
      - COLORECTAL_CANCER.clnc_tnm_stag_vl
    - name: clinical_tumor_feature
      kor: 임상 종양 특성
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_CLINICAL_TUMOR_FEATURE
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000391
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000391
        value_column: value_as_concept_id
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
    - name: pathologic_tnm
      kor: 수술 후 외과 병리 기록지의 TNM 병기값
      type: varchar
      value_kind: 패턴
      tier: 필수
      pattern: ^(y?p)?T(is|0|X|[1-4][a-c]?)N([0-3][a-c]?|X)M(0|1[a-c]?|X)$
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000392
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000392
        value_column: value_source_value
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - LUNG_CANCER
      v1_hint:
      - LUNG_CANCER.afop_path_tnm_stag_vl
      - BREAST_CANCER.afop_path_tnm_stag_vl
      - COLORECTAL_CANCER.afop_path_tnm_stag_vl
    - name: imaging_distant_metastasis_yn
      kor: 영상 판독상 원격 전이 여부
      type: integer
      value_kind: 예/아니오
      tier: 필수
      codelist: YN
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000393
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: MEASUREMENT
        concept: 10000000393
        value_column: value_as_concept_id
        date: staging_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
