meta:
  name: K-AI 질환별 코호트 데이터 모델
  version: 2.0.0
  source: 배치표_v0_20260912.xlsx
  generated_by: spec/build_spec_v2.py
  generated_at: '2026-09-22'
  concept_id: K-AI 어휘 · 64비트 정수 · 10,000,000,000 부터 · vocab/CONCEPT.csv
  principles:
  - 저장 테이블은 OMOP CDM 5.4 + Oncology(EPISODE, EPISODE_EVENT)의 이름·컬럼을 그대로 쓴다
  - concept_id 는 OMOP 이 아니라 K-AI 어휘이며, 표준 코드(SNOMED·LOINC·MedDRA)는 CONCEPT.concept_code 에 보관한다
  - 병원은 CRF 서식을 채우고 앱이 서식→레코드 규칙으로 저장 테이블을 만든다
  - 'OMOP 에 자리가 없는 병리 세부·질환 항목은 K-AI 확장 테이블(OMOP 관례: *_concept_id + *_source_value)'
  - 한 테이블 = 행 단위 하나
layers:
  omop:
  - PERSON
  - OBSERVATION_PERIOD
  - DEATH
  - VISIT_OCCURRENCE
  - CONDITION_OCCURRENCE
  - PROCEDURE_OCCURRENCE
  - DRUG_EXPOSURE
  - MEASUREMENT
  - OBSERVATION
  - NOTE
  - SPECIMEN
  - COHORT
  - EPISODE
  - EPISODE_EVENT
  extension:
  - PATHOLOGY_REPORT
  - PATHOLOGY_TUMOR
  - BIOMARKER
  - LUNG_EXAM
  - BREAST_BASELINE
  - BREAST_EXAM
  - COLORECTAL_EXAM
  - COLORECTAL_SURGERY_DETAIL
  - MASLD_EXAM
  - MASLD_ASSESSMENT
  - MASLD_EVENT
  - DIABETES_BASELINE
  - DIABETES_EVENT
  - LYMPHOMA_ASSESSMENT
  - LYMPHOMA_EVENT
  - LYMPHOMA_EXAM
tables:
  PERSON:
    name: PERSON
    layer: OMOP
    kor: 환자
    grain: 환자 1
    pk: person_id
    desc: OMOP CDM 5.4 표준 구조 (concept_id 는 K-AI 어휘)
    cohorts:
    - LUNG_CANCER
    - BREAST_CANCER
    - COLORECTAL_CANCER
