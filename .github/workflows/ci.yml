name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: 엔진 회귀 시험 (dq-ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dq-ts/package-lock.json
      - run: npm ci
        working-directory: dq-ts
      - run: npm run typecheck
        working-directory: dq-ts
      - run: npm test
        working-directory: dq-ts

  app:
    name: 앱 타입 검사와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run build
        working-directory: app
