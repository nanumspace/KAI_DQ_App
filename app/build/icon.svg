<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Quality Validator 앱 아이콘. K-AIPA 브랜드 팔레트: 남색 #003B73 → 청록 #00C2D1, 보조 파랑 #275BAB -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#003B73"/>
      <stop offset="0.62" stop-color="#275BAB"/>
      <stop offset="1" stop-color="#00C2D1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C2D1"/>
      <stop offset="1" stop-color="#00A3B5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001B36" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 배경: macOS 스타일 둥근 사각형 (여백 약 9%) -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>
  <!-- 은은한 하이라이트 -->
  <path d="M280 92 H744 A188 188 0 0 1 932 280 V420 C700 300 420 300 92 460 V280 A188 188 0 0 1 280 92 Z" fill="#ffffff" opacity="0.07"/>

  <!-- 데이터 테이블: 흰 카드에 헤더와 3행 -->
  <g filter="url(#shadow)">
    <rect x="236" y="258" width="552" height="508" rx="44" fill="#ffffff"/>
  </g>
  <!-- 헤더 행 -->
  <rect x="236" y="258" width="552" height="92" rx="44" fill="#003B73"/>
  <rect x="236" y="306" width="552" height="44" fill="#003B73"/>
  <rect x="290" y="288" width="120" height="32" rx="16" fill="#ffffff" opacity="0.85"/>
  <rect x="446" y="288" width="120" height="32" rx="16" fill="#ffffff" opacity="0.55"/>
  <rect x="602" y="288" width="120" height="32" rx="16" fill="#ffffff" opacity="0.55"/>
  <!-- 본문 행 (그리드 선) -->
  <line x1="236" y1="454" x2="788" y2="454" stroke="#D9E2EC" stroke-width="6"/>
  <line x1="236" y1="558" x2="788" y2="558" stroke="#D9E2EC" stroke-width="6"/>
  <line x1="236" y1="662" x2="788" y2="662" stroke="#D9E2EC" stroke-width="6"/>
  <line x1="420" y1="350" x2="420" y2="766" stroke="#D9E2EC" stroke-width="6"/>
  <line x1="576" y1="350" x2="576" y2="766" stroke="#D9E2EC" stroke-width="6"/>
  <!-- 셀 값 막대 -->
  <g fill="#275BAB" opacity="0.28">
    <rect x="276" y="386" width="100" height="30" rx="15"/>
    <rect x="452" y="386" width="80" height="30" rx="15"/>
    <rect x="608" y="386" width="110" height="30" rx="15"/>
    <rect x="276" y="490" width="110" height="30" rx="15"/>
    <rect x="452" y="490" width="96" height="30" rx="15"/>
    <rect x="276" y="594" width="86" height="30" rx="15"/>
    <rect x="608" y="594" width="70" height="30" rx="15"/>
    <rect x="276" y="698" width="104" height="30" rx="15"/>
    <rect x="452" y="698" width="60" height="30" rx="15"/>
  </g>
  <!-- 위반 셀 강조 (붉은 점) -->
  <circle cx="644" cy="505" r="15" fill="#D43333"/>

  <!-- 검증 배지: 청록 원 + 흰 체크 -->
  <g filter="url(#shadow)">
    <circle cx="742" cy="722" r="150" fill="url(#badge)"/>
  </g>
  <circle cx="742" cy="722" r="150" fill="none" stroke="#ffffff" stroke-width="22"/>
  <path d="M668 726 L722 780 L822 664" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
