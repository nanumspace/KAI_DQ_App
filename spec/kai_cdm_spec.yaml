        2=Squamous cell carcinoma

        3=Large cell carcinoma

        4=Small cell carcinoma

        5=Carcinoma tumor 계열

        6=NSCLC NOS

        7=기타'
      codelist: LUNG_CANCER.histologic_diagnosis
      group: patient
      level: person
