      - LUNG_CANCER
    - name: distant_metastasis_date
      kor: 원격 전이 진단일
      type: date
      value_kind: 날짜
      tier: 필수
      standard: SNOMED AJCC qualifier · OMOP Cancer Modifier
      concept_id: 10000000394
      desc: 체계·판·임상/병리 구분 필드 동반
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000394
        value_column: value_as_string
