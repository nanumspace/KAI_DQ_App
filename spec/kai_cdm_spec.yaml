      anchor: rcrd_ymd
      level: event
    - name: exercise_ycnt
      type: float
      required: false
      desc: 총 운동기간(년)이다.
      range:
      - 0
      - 90
      group: hist
      anchor: rcrd_ymd
      level: event
    - name: exercise_nt
      type: float
      required: false
      desc: 한 주 평균 운동횟수(회/주)이다.
      range:
