        drug 연결 시 MAX(drug_exposure_start_date + days_supply - 1)로 산출 가능'
    - name: line_of_therapy
      type: integer
      required: false
      desc: 치료 line 번호이다.
      range:
      - 1
      - 20
    - name: number_of_cycles
      type: integer
      required: false
      desc: 총 투여 사이클 수이다.
      range:
      - 1
      - 100
    - name: therapy_intent
      type: integer
      required: false
      desc: '치료 목적 코드이다.

        1=Neoadjuvant, 2=Adjuvant, 3=Palliative, 4=Maintenance, 5=Definitive, 6=Salvage'
      codelist: SACT.therapy_intent
    - name: ecog_performance_status
      type: integer
      required: false
      desc: "ECOG PS \n(0–5). 미상=NULL"
      range:
      - 0
      - 5
    - name: best_overall_response
      type: varchar
      required: false
      desc: '치료 반응 평가 원천 값이다. 예: CR, PR, SD, PD'
    - name: date_of_progression
      type: date
      required: false
      desc: Progressive Disease 질병 진행(악화) 발생 날짜이다.
    - name: recurrence_anatomic_site
      type: varchar
      required: false
      desc: PD 부위 및 상세 원천 값이다.
