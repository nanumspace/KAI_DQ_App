meta:
  name: K-AI 질환별 코호트 명세 v3 (의뢰사 9/30 매뉴얼 + 2026-10-01 검토 결정)
  version: 3.0.0
  source: spec/client_v1/매뉴얼_질환별 데이터 테이블_20260930_수정안.xlsx
  generated_by: spec/build_spec_v3.py
  decisions: spec/client_v1/매뉴얼_수정_제안서_20261001.md
  dropped_fields:
  - DRUG_EXPOSURE.note_id
tables:
  PERSON:
    name: PERSON
    kor: 환자
    section: 3.1 환자(PERSON)
    category: core
    pk: person_id
    fields:
    - name: person_id
      type: integer
      required: true
      desc: 개인에 대한 고유 식별자이다.
      key: PK
    - name: gender_concept_id
      type: integer
      required: true
      desc: 성별 정보를 나타내는 표준 Concept 식별자이다. CONCEPT 테이블을 참조하며, 성별 정보를 표준화된 형태로 관리하기 위해 사용된다.
      codelist: OMOP.gender_concept_id
    - name: year_of_birth
      type: integer
      required: true
      desc: 출생 연도이다.
      range:
      - 1900
      - 2026
    - name: month_of_birth
      type: integer
      required: false
      desc: 출생 월이다.
      range:
      - 1
      - 12
    - name: day_of_birth
      type: integer
      required: false
      desc: 출생 일이다.
      range:
      - 1
      - 31
    - name: age_at_index
      type: integer
      required: true
      desc: 인덱스 날짜(index date) 기준 대상자의 만 나이이다.
      range:
      - 0
      - 110
    - name: care_site_id
      type: integer
      required: true
      desc: CARE_SITE 테이블에서 참조된 PERSON의 주요 진료소를 나타내는 외래키이다.
      key: FK_EXTERNAL
      ref: CARE_SITE
    - name: observation_period_start_date
      type: date
      required: false
      desc: 해당 대상자에 대해 데이터 수집이 가능하다고 판단되는 관찰기간의 시작일이다.
    - name: death_date
      type: date
      required: false
      desc: 사망한 날짜이다.
  VISIT_OCCURRENCE:
    name: VISIT_OCCURRENCE
    kor: 방문
    section: 3.2 방문(VISIT_OCCURRENCE)
    category: core
    pk: visit_occurrence_id
    fields:
    - name: visit_occurrence_id
      type: integer
      required: true
      desc: 개인의 의료기관 방문 또는 진료 에피소드를 고유하게 식별하기 위한 식별자이다.
      key: PK
    - name: person_id
      type: integer
      required: true
      desc: 방문이 기록된 사람에 대한 외래키 식별자이다.
      key: FK
      ref: PERSON.person_id
    - name: visit_concept_id
      type: integer
      required: true
      desc: '방문 유형을 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Visit Domain Concept을 참조하는 외래키(Foreign Key)이다.

        예) 외래 = 9202 (Outpatient Visit), 입원 = 9201 (Inpatient Visit), 응급 = 9203 (Emergency Room Visit) ※ 고정한 Athena 판본에서 최종 확인'
      codelist: OMOP.visit_concept_id
    - name: visit_start_date
      type: date
      required: true
      desc: 방문 시작 날짜이다.
    - name: visit_end_date
      type: date
      required: true
      desc: "방문 종료 날짜이다. 다만 아래의 경우 visit_start_date와 visit_ end_date를 동일하게 입력한다.\n1. 방문이 동일한 날짜에 이루어진 경우 \n2. 퇴원일을 확인하기 어려운 경우"
    - name: visit_type_concept_id
      type: integer
      required: true
      desc: 방문 기록이 생성된 원천 데이터의 유형을 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.visit_type_concept_id
  PROCEDURE_OCCURRENCE:
    name: PROCEDURE_OCCURRENCE
    kor: 시술 및 처치
    section: 3.3 시술 및 처치(PROCEDURE_OCCURRENCE)
    category: core
    pk: procedure_occurrence_id
    fields:
    - name: procedure_occurrence_id
      type: integer
      required: true
      desc: 각 처치 발생에 대한 고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: 처치가 수행된 방문 기록을 참조하는 식별자로, VISIT_OCCURRENCE 테이블을 참조하는 외래키(Foreign Key)이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 처치를 받은 사람에 대한 외래키 식별자이다.
      key: FK
      ref: PERSON.person_id
    - name: procedure_concept_id
      type: integer
      required: true
      desc: 처치를 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Procedure Domain Concept을 참조하는 외래키이다.
    - name: procedure_source_value
      type: varchar
      required: false
      desc: 원천 처치·수가 코드이다.
    - name: procedure_date
      type: date
      required: true
      desc: 처치가 수행된 날짜이다.
    - name: procedure_type_concept_id
      type: integer
      required: true
      desc: 처치 기록이 생성된 원천 데이터의 유형을 나타내는 표준 Concept 식별자이다. 표준 용어체계의 Concept을 참조하며, 해당 정보의 출처와 생성 방식을 구분하기 위해 사용된다.
      codelist: OMOP.procedure_type_concept_id
  DRUG_EXPOSURE:
    name: DRUG_EXPOSURE
    kor: 약물 노출
    section: 3.4 약물 노출(DRUG_EXPOSURE)
    category: core
    pk: drug_exposure_id
    fields:
    - name: drug_exposure_id
      type: integer
      required: true
      desc: 약물 사용 이벤트에 대한 고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: true
      desc: 약물 투여가 시작된 방문 기록을 참조하는 식별자로, VISIT_OCCURRENCE 테이블을 참조하는 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 약물을 섭취한 사람에 대한 외래키 식별자이다.
      key: FK
      ref: PERSON.person_id
    - name: sact_id
      type: integer
      required: false
      desc: 'SACT 테이블과 연결되는 외래키 식별자이다. 항종양제(ATC L01)는 항암요법으로 투여되므로 필수이다. 내분비 치료제(ATC L02, 예: GnRHa·타목시펜)는 항암요법으로 투여한 경우에만 입력한다. 그 외 약물은 비워 둔다.'
      key: FK
      ref: SACT.sact_id
    - name: drug_concept_id
      type: integer
      required: true
      desc: 약물 정보를 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Drug Domain Concept을 참조하는 외래키(Foreign Key)이다.
    - name: drug_source_value
      type: varchar
      required: false
      desc: '원천 약품 코드이다. 예: EDI 코드, 원내 약품 코드'
    - name: drug_exposure_start_date
      type: date
      required: true
      desc: 약물 사용 시작 날짜이다.
    - name: drug_exposure_end_date
      type: date
      required: true
      desc: 약물 사용 종료 날짜이다.
    - name: days_supply
      type: integer
      required: false
      desc: 약물의 총 처방 일수이다.
      range:
      - 0
      - 400
    - name: amount_unit_concept_id
      type: integer
      required: false
      desc: 약물의 용량 단위를 나타내는 concept ID 이다.
      codelist: OMOP.amount_unit_concept_id
    - name: amount_value
      type: float
      required: false
      desc: 약물의 단일 용량 값이다.
      range:
      - 0
      - 100000
    - name: quantity
      type: float
      required: false
      desc: '원처방·조제·투여 기록에 기재된 약물의 양(정제 등: 개수, 액제: 투여·조제 총량, 주사 등: 투여된 성분량)이다.'
      range:
      - 0
      - 100000
    - name: numerator_value
      type: float
      required: false
      desc: 분자 함량 값이다.
    - name: numerator_unit_concept_id
      type: integer
      required: false
      desc: 분자 함량 측정 단위를 나타내는 concept_id 이다.
      codelist: OMOP.numerator_unit_concept_id
    - name: denominator_value
      type: float
      required: false
      desc: 분모 함량 값이다.
    - name: denominator_unit_concept_id
      type: integer
      required: false
      desc: 분모 함량 측정 단위를 나타내는 concept_id 이다.
      codelist: OMOP.denominator_unit_concept_id
    - name: frequency_per_day
      type: integer
      required: false
      desc: 1일 투여 횟수를 나타낸다. 매일 투여하는 경우 days_supply 값이 반드시 입력되어야 한다.
      range:
      - 1
      - 24
    - name: dosing_interval_day
      type: integer
      required: false
      desc: 투여 간격(일)을 나타낸다. 투여 간격이 1일을 초과하는 경우 dosing_number 값이 반드시 입력되어야 한다.
      range:
      - 1
      - 180
    - name: dosing_number
      type: integer
      required: false
      desc: 총 투여 횟수이다.
      range:
      - 1
      - 500
  CONDITION_OCCURRENCE:
    name: CONDITION_OCCURRENCE
    kor: 질환 발생
    section: 3.5 질환 발생(CONDITION_OCCURRENCE)
    category: core
    pk: condition_occurrence_id
    fields:
    - name: condition_occurrence_id
      type: integer
      required: true
      desc: 질환 발생 이벤트에 대한고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: 해당 질환이 확인된 방문 기록을 참조하는 식별자로, VISIT_OCCURRENCE 테이블을 참조하는 외래키(Foreign Key)이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 질환에 대한 조건이 기록된 사람에 대한 외래키 식별자이다.
      key: FK
      ref: PERSON.person_id
    - name: condition_concept_id
      type: integer
      required: true
      desc: 질환 상태를 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Condition Domain Concept을 참조하는 외래키이다.
    - name: condition_source_value
      type: varchar
      required: false
      desc: '원천 진단 코드이다. 예: KCD 코드, ICD-O-3 코드'
    - name: condition_start_date
      type: date
      required: true
      desc: 질환 발생의 시작 날짜이다.
    - name: condition_type_concept_id
      type: integer
      required: true
      desc: 질환 정보가 기록된 원천 데이터의 유형, 표준화 수준 및 발생 유형을 나타내는 표준 Concept 식별자이다. 질환 기록의 출처와 생성 방식을 구분하기 위해 사용된다.
      codelist: OMOP.condition_type_concept_id
  MEASUREMENT:
    name: MEASUREMENT
    kor: 검사
    section: 3.6 검사(MEASUREMENT)
    category: core
    pk: measurement_id
    fields:
    - name: measurement_id
      type: integer
      required: true
      desc: 측정(검사) 기록에 대한 고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: 측정(Measurement)이 수행되거나 기록된 방문 정보를 참조하는 식별자로, VISIT_OCCURRENCE 테이블을 참조하는 외래키(Foreign Key)이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 측정이 수행된 사람에 대한 외래키 식별자이다.
      key: FK
      ref: PERSON.person_id
    - name: measurement_concept_id
      type: integer
      required: true
      desc: 측정 항목을 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Measurement Domain Concept을 참조하는 외래키이다.
    - name: measurement_source_value
      type: varchar
      required: false
      desc: 원천 데이터의 검사 항목 코드·명칭이다.
    - name: measurement_date
      type: date
      required: true
      desc: 측정이 수행된 날짜이다.
    - name: measurement_type_concept_id
      type: integer
      required: true
      desc: 측정 정보가 생성된 원천 데이터의 유형 또는 출처(Provenance)를 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.measurement_type_concept_id
    - name: value_as_number
      type: float
      required: false
      desc: 측정값이 정량적일 때 기록되는 값이다.
      range:
      - -1000000
      - 1000000
    - name: value_as_concept_id
      type: integer
      required: false
      desc: 측정 결과가 범주형 값인 경우 해당 결과를 나타내는 표준 Concept 식별자이다.
    - name: unit_concept_id
      type: integer
      required: false
      desc: 측정 결과의 단위를 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.unit_concept_id
    - name: range_low
      type: float
      required: false
      desc: 측정값이 정상 범위 내 최저값을 나타낸다.
      range:
      - -1000000
      - 1000000
    - name: range_high
      type: float
      required: false
      desc: 측정값의 정상 범위 내 최고값을 나타낸다.
      range:
      - -1000000
      - 1000000
    - name: unit_source_value
      type: varchar
      required: false
      desc: 원천 데이터에 존재하는 단위기준 값이다.
    - name: value_source_value
      type: varchar
      required: false
      desc: 원천 데이터에 기록된 측정 결과의 원본 값으로 value_as_number 또는 value_as_concept_id로 변환되기 전의 원본 결과 정보를 나타낸다.
  OBSERVATION:
    name: OBSERVATION
    kor: 관찰
    section: 3.7 관찰(OBSERVATION)
    category: core
    pk: observation_id
    fields:
    - name: observation_id
      type: integer
      required: true
      desc: 관찰에 대한 고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: true
      desc: 개인의 의료기관 방문 또는 진료 에피소드를 고유하게 식별하기 위한 식별자이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 관찰이 기록된 사람에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
    - name: observation_concept_id
      type: integer
      required: true
      desc: 관찰된 임상적 사실을 나타내는 표준 Concept 식별자로, 표준 용어체계(Standardized Vocabularies)의 Observation Concept을 참조하는 외래키(Foreign Key)이다.
    - name: observation_source_value
      type: varchar
      required: false
      desc: 원천 데이터의 관찰 항목 코드·명칭이다.
    - name: observation_date
      type: date
      required: true
      desc: 관찰이 이루어진 날짜이다.
    - name: observation_type_concept_id
      type: integer
      required: true
      desc: 관찰 정보의 기록 유형 또는 원천 데이터의 출처를 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.observation_type_concept_id
    - name: value_as_number
      type: float
      required: false
      desc: 관찰 결과가 수치형(Numeric)인 경우 해당 값을 저장한다.
      range:
      - -1000000
      - 1000000
    - name: value_as_string
      type: varchar
      required: false
      desc: 관찰 결과가 자유 형식의 텍스트(Verbatim Text)인 경우 해당 문자열 값을 저장한다.
    - name: value_as_concept_id
      type: integer
      required: false
      desc: '관찰 결과가 범주형인 경우 해당 결과를 나타내는 표준 Concept 식별자이다. 원천 코드(예: 1=Yes)를 그대로 넣지 않는다.'
    - name: unit_concept_id
      type: integer
      required: false
      desc: 수치형 관찰 결과의 측정 단위를 나타내는 표준 Concept 식별자이다. 표준 용어체계에 정의된 단위를 참조한다.
      codelist: OMOP.unit_concept_id
    - name: value_source_value
      type: varchar
      required: false
      desc: 원천 데이터에 기록된 관찰 결과의 원본 값으로, value_as_number·value_as_string·value_as_concept_id로 변환되기 전의 값이다.
  NOTE:
    name: NOTE
    kor: 노트
    section: 3.8 노트(NOTE)
    category: core
    pk: note_id
    fields:
    - name: note_id
      type: integer
      required: true
      desc: 노트(Note)에 대한 고유 식별자이다.
      key: PK
    - name: visit_occurrence_id
      type: integer
      required: false
      desc: 노트가 작성된 방문 정보를 참조하는 값으로, VISIT_OCCURRENCE 테이블을 참조하는 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: person_id
      type: integer
      required: true
      desc: 노트와 관련된 사람에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
    - name: note_date
      type: date
      required: true
      desc: 노트가 작성된 날짜를 나타낸다.
    - name: note_text
      type: text
      required: false
      desc: 노트의 원문 내용을 저장한다.
    - name: note_type_concept_id
      type: integer
      required: true
      desc: 노트의 유형을 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.note_type_concept_id
    - name: note_class_concept_id
      type: integer
      required: true
      desc: 노트의 분류(Class)를 나타내는 표준 Concept 식별자이다.
      codelist: OMOP.note_class_concept_id
    - name: file_id
      type: integer
      required: false
      desc: 이미지 및 영상 파일에 대한 외래키이다.
  DRUG_INGREDIENT_STRUCTURE:
    name: DRUG_INGREDIENT_STRUCTURE
    kor: 구조식
    section: 3.9 약물 성분 구조식(DRUG_INGREDIENT_STRUCTURE)
    category: reference
    pk: ingredient_concept_id
    fields:
    - name: ingredient_concept_id
      type: integer
      required: true
      desc: 약물 성분(RxNorm Ingredient 등)을 나타내는 표준 Concept 식별자이다. DRUG_EXPOSURE.drug_concept_id와는 표준 어휘의 성분 관계(CONCEPT_ANCESTOR)로 연결한다.
      key: PK
    - name: smiles
      type: varchar
      required: true
      desc: 해당 성분의 화학 구조식(SMILES)이다. AI 학습용. 복합제는 각 성분 행으로 표현한다.
  LUNG_CANCER:
    name: LUNG_CANCER
    kor: 폐암
    section: 4.1 폐암(LUNG_CANCER)
    category: disease
    pk: lung_cancer_id
    fields:
    - name: lung_cancer_id
      type: integer
      required: true
      desc: 폐암 특화 테이블에 대한 고유 식별자이다.
      key: PK
    - name: person_id
      type: integer
      required: true
      desc: PERSON 테이블에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
    - name: visit_occurrence_id
      type: integer
      required: true
      desc: VISIT_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: diag_rgst_ymd
      type: date
      required: true
      desc: 해당 암을 최초로 진단(조직학적 확진)한 날짜이다. 진단정보 등록일과 동일하다.
    - name: histologic_diagnosis
      type: integer
      required: true
      desc: '원발 진단(조직형) 원천 코드이다.

        1=Adenocarcinoma, 2=Squamous cell carcinoma, 3=Large cell carcinoma, 4=Small cell carcinoma, 5=Carcinoma tumor 계열, 6=NSCLC NOS, 7=기타'
      codelist: LUNG_CANCER.histologic_diagnosis
    - name: histology_icdo3_code
      type: varchar
      required: true
      desc: '원발 진단(조직형)의 ICD-O-3 형태 코드이다. 예: 8140/3'
      pattern: ^\d{4}/[0-9]$
    - name: primary_site_icdo3_code
      type: varchar
      required: true
      desc: '원발 부위의 ICD-O-3 부위 코드이다. 예: C34.1'
      pattern: ^C\d{2}\.\d$
    - name: histologic_diagnosis_source_value
      type: varchar
      required: true
      desc: 원발 진단(조직형)의 명칭으로, 원천에서 자유 기입된 값이다.
    - name: clinical_stage
      type: varchar
      required: true
      desc: '초진 시 AJCC 임상 병기이다. clinical_stage_ajcc_edition 판수의 병기군으로 기입한다.

        8판: 0, IA1, IA2, IA3, IB, IIA, IIB, IIIA, IIIB, IIIC, IVA, IVB / 7판: 0, IA, IB, IIA, IIB, IIIA, IIIB, IV

        소세포폐암(histologic_diagnosis = 4)에서 VALSG 병기를 쓰는 경우 LD(제한기) 또는 ED(확장기)로 기입한다.'
    - name: clinical_stage_ajcc_edition
      type: integer
      required: false
      desc: clinical_stage 판정에 사용한 AJCC 판수이다. 6, 7, 8 중 하나로 기입한다. AJCC 병기를 기입한 경우 필수이며, 소세포폐암을 제한기/확장기(LD/ED)로 기록한 경우 비워 둔다.
      codelist: LUNG_CANCER.clinical_stage_ajcc_edition
    - name: stage_iv_diagnosis_date
      type: date
      required: false
      desc: Stage IV로 진단된 날짜이다. 조기 폐암(early lung cancer)으로 수술한 경우에는 재발한 날짜(≈ days_to_recurrence)를 기입하며, Stage IV 환자는 최초 진단 날짜와 동일하게 기입한다(≈ days_to_diagnosis).
