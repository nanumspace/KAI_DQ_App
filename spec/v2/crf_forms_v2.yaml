forms:
  COHORT_INDEX:
    name: COHORT_INDEX
    kor: 코호트 인덱스
    grain: 환자 1
    kind: OMOP 투영
    storage:
    - COHORT
    - OBSERVATION_PERIOD
    - CONDITION_OCCURRENCE
    - EPISODE
    - EPISODE_EVENT
    - OBSERVATION
    cohorts:
    - BREAST_CANCER
    - COLORECTAL_CANCER
    - DIABETES
    - LUNG_CANCER
    - LYMPHOMA
    - MASLD
    fields:
    - name: person_id
      kor: 코호트 인덱스 ID
      type: bigint
      value_kind: 키
      tier: 필수
      required: true
      key: pk
      desc: 행 고유키
      target:
        kind: anchor
        table: COHORT
        column: subject_id
        ref: COHORT
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - DIABETES
      - LUNG_CANCER
      - LYMPHOMA
      - MASLD
    - name: index_date
      kor: 코호트 진입일(기준일)
      type: date
      value_kind: 날짜
      tier: 필수
      required: true
      event_date: true
      desc: 행의 기준 사건일
      target:
        kind: anchor
        table: COHORT
        column: cohort_start_date
        ref: COHORT
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - DIABETES
      - LUNG_CANCER
      - LYMPHOMA
      - MASLD
    - name: diagnosis_registered_date
      kor: 진단정보 등록일
      type: date
      value_kind: 날짜
      tier: 필수
      concept_id: 10000000371
      desc: 유병 기간·진단 나이는 진단일에서 파생 가능
      target:
        kind: anchor
        table: CONDITION_OCCURRENCE
        column: condition_start_date
        ref: DX
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - DIABETES
      - LUNG_CANCER
      - MASLD
      v1_hint:
      - LUNG_CANCER.diag_rgst_ymd
      - BREAST_CANCER.diag_rgst_ymd
      - COLORECTAL_CANCER.diag_rgst_ymd
      - DIABETES.condition_type_concept_id
    - name: diagnosis_name
      kor: 진단명
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000372
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: anchor
        table: CONDITION_OCCURRENCE
        column: condition_source_value
        ref: DX
      cohorts:
      - BREAST_CANCER
      - COLORECTAL_CANCER
      - DIABETES
      - LUNG_CANCER
      - MASLD
      v1_hint:
      - LUNG_CANCER.lucn_diag_kncd
      - COLORECTAL_CANCER.clcn_diag_kncd
    - name: diagnosis_subtype
      kor: 세부 진단명
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_DIAGNOSIS_SUBTYPE
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000373
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000373
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - COLORECTAL_CANCER
      v1_hint:
      - COLORECTAL_CANCER.bpsy_rctm_dtl_site_cont
    - name: masld_diagnosis_basis
      kor: MASLD/MASH 진단 근거 기준
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_MASLD_DIAGNOSIS_BASIS
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000374
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000374
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - MASLD
    - name: diabetes_type
      kor: 당뇨병 유형
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: DM_TYPE
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000375
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000375
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - DIABETES
      v1_hint:
      - DIABETES.dm_id
    - name: age_at_diagnosis
      kor: 당뇨병 최초 진단 시 나이
      type: integer
      value_kind: 수치
      tier: 필수
      concept_id: 10000000376
      desc: 유병 기간·진단 나이는 진단일에서 파생 가능
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000376
        value_column: value_as_number
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - DIABETES
    - name: disease_duration_years
      kor: 당뇨병 유병 기간
      type: float
      value_kind: 수치
      tier: 필수
      concept_id: 10000000377
      desc: 유병 기간·진단 나이는 진단일에서 파생 가능
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000377
        value_column: value_as_number
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - DIABETES
    - name: gestational_diabetes_yn
      kor: 임신성 당뇨병 해당 여부
      type: integer
      value_kind: 예/아니오
      tier: 필수
      codelist: YN
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000378
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000378
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - DIABETES
    - name: first_diagnosis_date
      kor: 최초 림프종 진단일
      type: date
      value_kind: 날짜
      tier: 필수
      concept_id: 10000000379
      desc: 유병 기간·진단 나이는 진단일에서 파생 가능
      target:
        kind: anchor
        table: CONDITION_OCCURRENCE
        column: condition_start_date
        ref: DX
      cohorts:
      - LYMPHOMA
    - name: diagnosis_status
      kor: 진단 상태
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_DIAGNOSIS_STATUS
      concept_id: 10000000380
      desc: 유병 기간·진단 나이는 진단일에서 파생 가능
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000380
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.condition_occurrence_id
    - name: lymphoma_category
      kor: 림프종 대분류
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_LYMPHOMA_CATEGORY
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000381
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000381
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.lym_id
    - name: cell_lineage
      kor: 종양 세포 계열
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_CELL_LINEAGE
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000382
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000382
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.cell_lineage
    - name: histologic_subtype
      kor: WHO/ICC 기준 조직학적 아형
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: CL_HISTOLOGIC_SUBTYPE
      standard: SNOMED/ICD-O-3/KCD
      concept_id: 10000000383
      desc: 코호트 정의 진단은 CONDITION FK, 아형은 코드표
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000383
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
      - LYMPHOMA.histologic_subtype
    - name: last_disease_status
      kor: 최종 추적 시 질환 상태
      type: varchar
      value_kind: 닫힌 범주
      tier: 필수
      codelist: LAST_STATUS
      standard: SNOMED
      concept_id: 10000000384
      desc: 최종 추적일·질환 상태·생존 상태
      target:
        kind: attr
        table: OBSERVATION
        concept: 10000000384
        value_column: value_as_concept_id
        date: index_date
        event_ref: DX
        event_field: F_CONDITION
        unit: null
      cohorts:
      - LYMPHOMA
      v1_hint:
