  MASLD:
    name: MASLD
    kor: 대사이상지방간
    section: 4.4 대사이상지방간(MASLD)
    category: disease
    pk: masld_id
    fields:
    - name: masld_id
      type: integer
      required: true
      desc: 대사이상지방간 특화 테이블에 대한 고유 식별자이다.
      key: PK
    - name: person_id
      type: integer
      required: true
      desc: PERSON 테이블에 대한 외래키이다.
      key: FK
      ref: PERSON.person_id
    - name: visit_occurrence_id
      type: integer
      required: true
      desc: VISIT_OCCURRENCE 테이블에 대한 외래키이다.
      key: FK
      ref: VISIT_OCCURRENCE.visit_occurrence_id
    - name: fib4_score
      type: float
      required: false
      desc: 'FIB-4 산출 결과값이다.

        Formula = age (years) × AST [U/L] / (platelet count[109/L]) × (ALT [U/L]1/2)'
      range:
      - 0
      - 50
    - name: apri_score
      type: float
      required: false
      desc: 'APRI 산출 결과값이다.

        Formula = [(AST/upper limit of normal of AST)×100] / platelet count(109/L)×100'
      range:
      - 0
      - 30
    - name: bard_score
      type: float
      required: false
      desc: 'BARD 산출 결과값이다.

        이하 항목별 점수 부여 후 합산 (0~4, 총점 기반 위험 분류)

        1. AST/ALT ratio >= 0.8 : 2점

        2. BMI >= 28kg/m² : 1점

        3. 당뇨병: 1점'
      range:
      - 0
      - 4
    - name: safe_score
      type: float
      required: false
      desc: "SAFE 스코어 산출 결과값이다.\nFormula = (2.97 × age) + (5.99 × BMI [BMI > 40은 40으로 설정]) \n+ (62.85 × diabetes [없으면 0, 있으면 1] + (154.85 × Ln(AST)) \n- (58.23 ×\
        \ Ln(ALT)) + (195.48 × Ln(globulin))\n- (141.61 × Ln(platelets) - 75)"
      range:
      - -50
      - 300
    - name: liverrisk_score
      type: float
      required: false
      desc: 'LiverRisk score 산출 결과값이다.

        Calculator https://www.liverriskscore.com/multicalc'
