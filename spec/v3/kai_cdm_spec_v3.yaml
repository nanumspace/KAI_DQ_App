      desc: '가임력 보존 치료 종류를 나타내는 코드값이다.

        1=GnRHa, 2=난자 동결, 3=배아 동결, 4=기타, 5=GnRHa+동결'
      codelist: BREAST_CANCER.fertility_treatment_type
  COLORECTAL_CANCER:
    name: COLORECTAL_CANCER
